name: Daily Job Collector

on:
  schedule:
    # 每天北京时间 08:00 (UTC 00:00) 运行
    - cron: "0 0 * * *"
  # 也支持手动触发
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('collector/requirements.txt') }}

      - name: Install Python dependencies
        run: |
          pip install -r collector/requirements.txt
          pip install playwright
          playwright install chromium --with-deps

      - name: Run collector
        id: collector
        run: |
          python collector/main.py --output jobs.json
          echo "COUNT=$(python -c 'import json; print(len(json.load(open(\"jobs.json\")).get(\"jobs\",[])))')" >> $GITHUB_OUTPUT

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if jobs.json changed
          if git diff --quiet jobs.json; then
            echo "No changes in jobs.json"
          else
            git add jobs.json
            git commit -m "chore: daily job collection update (${{ steps.collector.outputs.COUNT }} jobs)"
            git push
            echo "Committed ${{ steps.collector.outputs.COUNT }} jobs"
          fi
