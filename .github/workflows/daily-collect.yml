name: Daily Job Collector

on:
  schedule:
    # 每天北京时间 08:00 (UTC 00:00) 运行
    - cron: "0 0 * * *"
  # 也支持手动触发
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('collector/requirements.txt') }}

      - name: Install Python dependencies
        run: |
          pip install -r collector/requirements.txt
          pip install playwright
          playwright install chromium --with-deps

      - name: Run collector
        id: collector
        env:
          # 登录态 Cookie（在仓库 Settings → Secrets → Actions 中配置后可提升采集覆盖）
          # BOSS_COOKIES: 从 Boss 直聘登录后的 Cookie 复制（格式 "k=v; k2=v2"）
          # YJS_COOKIES: 从应届生求职网登录后的 Cookie 复制
          BOSS_COOKIES: ${{ secrets.BOSS_COOKIES }}
          YJS_COOKIES: ${{ secrets.YJS_COOKIES }}
        run: |
          python collector/main.py --output jobs.json
          python - <<'PY' >> $GITHUB_OUTPUT
          import json
          try:
              n = len(json.load(open('jobs.json')).get('jobs', []))
          except Exception:
              n = 0
          print(f"COUNT={n}")
          PY
          echo "Collected $(grep COUNT= $GITHUB_OUTPUT | cut -d= -f2) jobs"

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          COUNT="${{ steps.collector.outputs.COUNT }}"

          # 0 条结果不覆盖历史数据，避免清空岗位库
          if [ "${COUNT:-0}" -eq 0 ]; then
            echo "本次采集 0 条，保留历史 jobs.json"
            git checkout -- jobs.json 2>/dev/null || true
            exit 0
          fi

          # Check if jobs.json changed
          if git diff --quiet jobs.json; then
            echo "No changes in jobs.json"
          else
            git add jobs.json
            git commit -m "chore: daily job collection update (${COUNT} jobs)"
            git push
            echo "Committed ${COUNT} jobs"
          fi
